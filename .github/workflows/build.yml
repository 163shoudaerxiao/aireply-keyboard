# GitHub Actions: build unsigned IPA on macOS cloud runner (no Mac needed)
# Trigger: push to main (auto) or manual Run workflow button
# Artifact: AIReplyShell-unsigned-ipa.zip -> unzip to get .ipa

name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.swift"
      - "project.yml"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16 (match XcodeGen project format)
        run: |
          ls /Applications | grep Xcode || true
          for v in Xcode_16.2 Xcode_16.1 Xcode_16 Xcode_15.4; do
            if [ -d "/Applications/$v.app" ]; then
              sudo xcode-select -s "/Applications/$v.app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive build (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AIReplyShell.xcodeproj \
            -scheme AIReplyShell \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AIReplyShell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "(error|warning:|BUILD|ARCHIVE)" || true
          test -d build/AIReplyShell.xcarchive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/AIReplyShell.xcarchive/Products/Applications/AIReplyShell.app" build/Payload/
          cd build
          zip -qry AIReplyShell-unsigned.ipa Payload
          ls -lh AIReplyShell-unsigned.ipa

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIReplyShell-unsigned-ipa
          path: build/AIReplyShell-unsigned.ipa
